    .home-logo { z-index:10000; background:#fff; border:1.5px solid #ffd8d0; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
    .home-logo:hover, .home-logo:focus-visible { border-color:#ff5a5f; box-shadow:0 2px 12px rgba(255,90,95,0.25); }
    .home-logo-sq { background:linear-gradient(135deg,#ff5a5f,#ffa9a9); }
    :root{
      --bg1: linear-gradient(135deg,#ffd8d0 0%, #ffe9b3 50%, #d2f8d2 100%);
      --card-bg: rgba(255,255,255,0.96);
      --accent: #ff5a5f;
      --accent2: #00a699;
    }
    html,body{ height:100%; margin:0; font-family: "Noto Sans Devanagari","Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:var(--bg1); }

    .stage { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:2rem; box-sizing:border-box; }

    .card-flash {
      width:min(760px,92vw); height:min(440px,62vh); max-height:560px;
      display:flex; align-items:center; justify-content:center; border-radius:20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      background:var(--card-bg);
      position:relative; cursor:pointer; overflow:hidden; -webkit-tap-highlight-color: transparent;
      user-select:none; -webkit-user-select:none;
    }
    .card-flash::before, .card-flash::after { content:""; position:absolute; pointer-events:none; z-index:0; }
    .card-flash::before {
      inset:-45%; border-radius:50%;
      background:conic-gradient(from 0deg, rgba(255,90,95,.55), transparent 72deg, transparent 150deg, rgba(0,166,153,.55) 180deg, transparent 252deg, transparent 330deg, rgba(255,90,95,.55));
      filter:blur(40px); animation:cardGlowOrbit 32s linear infinite;
    }
    .card-flash::after { inset:0; background:radial-gradient(ellipse at center, rgba(255,255,255,.98) 0%, rgba(255,255,255,.96) 34%, rgba(255,255,255,.5) 70%, transparent 100%); }
    @keyframes cardGlowOrbit { to { transform:rotate(360deg); } }
    .page-hidden .card-flash::before { animation-play-state:paused; }

    .word { z-index:2; font-size:clamp(45px,10vw,145px); font-weight:700; text-align:center; padding:0 1rem; color:#222; display:inline-block; max-width:100%; overflow-wrap:anywhere; line-height:1.2; }


    .controls { position:absolute; top:12px; right:12px; z-index:3; display:flex; gap:0.5rem; align-items:center; }
    .btn-circle { width:44px; height:44px; padding:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(0,0,0,0.12); font-size:18px; background:white; }

    .anim-flip { position:relative; z-index:2; max-width:100%; min-width:0; transition: transform 260ms cubic-bezier(.2,.9,.3,1), opacity 160ms ease; transform-origin:center; will-change:transform,opacity; }
    .anim-flip.out { transform: rotateX(20deg) scale(0.88) translateY(8px); opacity:0; }
    .anim-flip.in { transform: rotateX(-18deg) scale(1.02); opacity:0; }
    .anim-flip.in.show { transform: rotateX(0deg) scale(1); opacity:1; }

    .levels-button { position:absolute; z-index:3; left:12px; top:12px; border-radius:12px; font-weight:600; box-shadow:0 6px 14px rgba(0,0,0,0.12); }

    .read-today { font-size:13px; padding:6px 10px; border:0; border-radius:12px; background:rgba(255,255,255,0.9); box-shadow:0 6px 10px rgba(0,0,0,0.06); color:#333; display:inline-flex; gap:8px; align-items:center; font-weight:600; cursor:pointer; }
    .read-today:focus-visible { outline:3px solid #557b46; outline-offset:3px; }

    .activity-overlay { position:fixed; inset:0; z-index:10001; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(36,49,39,.45); backdrop-filter:blur(6px); }
    .activity-overlay[hidden] { display:none; }
    .activity-card { width:min(440px,100%); max-height:calc(100dvh - 40px); overflow:auto; padding:24px; border-radius:22px; background:#fffdf6; box-shadow:0 24px 70px rgba(20,30,20,.25); color:#27392e; }
    .activity-header { display:flex; align-items:start; justify-content:space-between; gap:12px; }
    .activity-header h2 { font-size:24px; line-height:1.2; margin:0; }
    .activity-header p { margin:6px 0 0; color:#637064; font-size:14px; }
    .activity-close { background:#ecf0e5; border:0; border-radius:10px; width:36px; height:36px; font-size:23px; line-height:1; color:#314d38; }
    .activity-grid { display:grid; grid-template-rows:repeat(7,36px); grid-template-columns:repeat(4,minmax(0,1fr)); grid-auto-flow:column; gap:8px; margin:24px 0 14px; }
    .activity-day { border:1px solid rgba(39,57,46,.08); border-radius:7px; padding:0 4px; background:#e8ede3; color:#647064; font-size:11px; font-weight:600; cursor:pointer; }
    .activity-day[data-intensity="1"] { background:#bad4ac; }
    .activity-day[data-intensity="2"] { background:#84b678; }
    .activity-day[data-intensity="3"] { background:#4c8b5c; }
    .activity-day[data-intensity="4"] { background:#276942; }
    .activity-day[data-intensity="2"], .activity-day[data-intensity="3"], .activity-day[data-intensity="4"] { color:rgba(255,255,255,.82); }
    .activity-day[data-today="true"] { outline:2px solid #243f31; outline-offset:2px; }
    .activity-day:focus-visible, .activity-close:focus-visible { outline:3px solid #243f31; outline-offset:2px; }
    .activity-detail { margin:0; min-height:1.5em; font-size:14px; font-weight:600; text-align:center; }

    .footer-note { position:absolute; bottom:10px; right:14px; z-index:2; font-size:12px; color:#333; opacity:0.85; }

    /* Level selection modal overlay */
    .level-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:64px 20px 24px; background:rgba(49,58,39,0.35); backdrop-filter:blur(8px); z-index:9999; overflow-y:auto; }
    .level-card { width:min(900px,100%); max-height:100%; overflow-y:auto; padding:32px; border-radius:28px; background:#fffdf6; box-shadow:0 24px 80px rgba(49,58,39,0.22); color:#27392e; }
    .level-header { display:grid; grid-template-columns:1fr; gap:16px; text-align:center; }
    #levelTitle { font-size:clamp(38px,6vw,68px); line-height:1.08; font-weight:750; letter-spacing:-1.5px; margin:0 0 16px; }
    .level-intro { color:#637064; margin:0 auto; max-width:52ch; line-height:1.6; }
    .level-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:24px 0 20px; }
    .level-btn { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:16px; text-align:left; padding:24px; min-height:150px; border-radius:18px; border:2px solid transparent; background:#f0f3e8; color:#27392e; cursor:pointer; transition:transform 180ms ease,background 180ms ease,border-color 180ms ease; }
    .level-btn:hover { background:#e6eedc; transform:translateY(-2px); }
    .level-btn:active { transform:translateY(0); }
    .level-btn[aria-current="true"] { border-color:#557b46; background:#eaf1df; }
    .level-btn:focus-visible { outline:3px solid #557b46; outline-offset:4px; }
    .level-icon { grid-column:2; grid-row:1; font-size:42px; line-height:1; }
    .level-text { grid-column:1; grid-row:1; display:flex; flex-direction:column; gap:8px; }
    .level-name { font-size:21px; font-weight:700; margin:0; line-height:1.3; }
    .level-subtitle { font-size:clamp(24px,3vw,30px); font-weight:650; line-height:1.5; }
    @media (prefers-reduced-motion:reduce) { .level-btn, .anim-flip { transition:none; } .card-flash::before { animation:none; } }

      .btn-circle { width:40px; height:40px; font-size:16px; }
      .level-overlay { padding:64px 12px 16px; }
      .level-card { padding:22px 18px; border-radius:22px; }
      .level-grid { grid-template-columns:1fr; gap:12px; margin-top:20px; }
      .level-btn { padding:18px; }
      .word { font-size:clamp(40px,10vw,62.5px); }
    }

  <a href="../../" aria-label="Back to home" class="home-logo">

  <!-- Level selection overlay (shown at start) -->
  <div id="levelOverlay" class="level-overlay" role="dialog" aria-modal="true" aria-labelledby="levelTitle" aria-describedby="levelIntro">
    <div class="level-card">
      <div class="level-header">
        <div>
          <h1 id="levelTitle">Little words,<br>Big adventures.</h1>
          <p id="levelIntro" class="level-intro">Practice reading 550 Hindi words across four levels, from first words and matras to joined letters.</p>
        </div>
      </div>
      <div id="levelGrid" class="level-grid" aria-label="Reading levels"></div>
    </div>
  </div>

    <div class="card-flash" id="card" tabindex="0" role="button" aria-label="Hindi flash card. Tap the left quarter for the previous word; tap the rest for the next word. Use left and right arrow keys with a keyboard.">
      <button id="levelsBtn" type="button" class="btn btn-light levels-button" aria-haspopup="dialog" aria-controls="levelOverlay">Levels</button>

      <div class="controls" aria-hidden="false">
        <button id="readTodayBox" type="button" class="read-today" title="Show the last 28 days of cards" aria-label="Show activity for the last 28 days" aria-haspopup="dialog" aria-controls="activityOverlay">📘 Today <span id="readTodayCount">0</span></button>
        <button id="hintTTS" class="btn btn-light btn-circle" title="Pronounce word" aria-label="Pronounce word">💬</button>
        <button id="shuffleBtn" class="btn btn-light btn-circle" title="Shuffle / Restart" aria-label="Shuffle or restart">🔀</button>
        <button id="soundBtn" class="btn btn-light btn-circle" title="Mute all audio" aria-label="Mute all audio" aria-pressed="true">🔊</button>
      </div>

      <div class="anim-flip" id="wordEl" aria-live="polite">
        <div class="word" id="wordText" lang="hi">शब्द</div>
      </div>

      <div class="footer-note" id="progress">0 / 0</div>
    </div>
  </div>

  <div id="activityOverlay" class="activity-overlay" role="dialog" aria-modal="true" aria-labelledby="activityTitle" hidden>
    <div class="activity-card">
      <div class="activity-header">
        <div>
          <h2 id="activityTitle">Last 28 days</h2>
          <p>Your progress each day</p>
        </div>
        <button id="closeActivityBtn" type="button" class="activity-close" aria-label="Close activity">×</button>
      </div>
      <div id="activityGrid" class="activity-grid" aria-label="Daily card activity"></div>
      <p id="activityDetail" class="activity-detail" aria-live="polite"></p>
    </div>
  </div>

/* ============
   LocalStorage helpers
   ============ */
function dateKey(d) {
  return 'hindi_flash_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey() { return dateKey(new Date()); }
function levelKey() { return 'hindi_flash_level'; }

function readCountForDate(date) {
  try {
    const value = Number.parseInt(localStorage.getItem(dateKey(date)) || '0', 10);
    return Number.isFinite(value) ? Math.max(0, value) : 0;
  } catch(e) { return 0; }
}
function readTodayGet() { return readCountForDate(new Date()); }
function readTodaySet(n) { try{ localStorage.setItem(todayKey(), String(n)); }catch(e){} }
function recentActivity(today = new Date()) {
  const days = [];
  const localNoon = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
  for(let offset = 27; offset >= 0; offset--) {
    const date = new Date(localNoon);
    date.setDate(localNoon.getDate() - offset);
    const count = readCountForDate(date);
    const intensity = count === 0 ? 0 : count < 10 ? 1 : count < 30 ? 2 : count < 60 ? 3 : 4;
    days.push({ date, count, intensity, isToday:offset === 0 });
  }
  return days;
}
function renderActivity() {
  activityGrid.replaceChildren();
  const days = recentActivity();
  const formatDate = new Intl.DateTimeFormat('en-IN', { day:'numeric', month:'short', year:'numeric' });
  const formatTileDate = new Intl.DateTimeFormat('en-IN', { day:'numeric', month:'short' });
  for(const day of days) {
    const dateLabel = formatDate.format(day.date);
    const label = `${dateLabel}: ${day.count} ${day.count === 1 ? 'card' : 'cards'} shown`;
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'activity-day';
    cell.dataset.intensity = String(day.intensity);
    if(day.isToday) cell.dataset.today = 'true';
    cell.setAttribute('aria-label', label);
    cell.title = label;
    cell.textContent = formatTileDate.format(day.date);
    cell.addEventListener('click', () => { activityDetail.textContent = label; });
    activityGrid.appendChild(cell);
  }
  const today = days[days.length - 1];
  activityDetail.textContent = `${formatDate.format(today.date)}: ${today.count} ${today.count === 1 ? 'card' : 'cards'} shown`;
}
function showActivity() {
  renderActivity();
  activityOverlay.hidden = false;
  mainStage.inert = true;
  closeActivityBtn.focus();
}
function hideActivity() {
  activityOverlay.hidden = true;
  mainStage.inert = false;
  readTodayBox.focus();
}
readTodayBox.addEventListener('click', (event) => { event.stopPropagation(); showActivity(); });
closeActivityBtn.addEventListener('click', hideActivity);

  document.body.classList.toggle('page-hidden', document.hidden);
});

/* ============
   Voice / TTS
   ============ */
const supportsSpeechSynthesis = typeof window.speechSynthesis !== 'undefined';
let availableVoices = [];
let preferHindiVoice = null;
let finishSpeech = null;
function populateVoices() {
  if(!supportsSpeechSynthesis) return;
  availableVoices = window.speechSynthesis.getVoices() || [];
  preferHindiVoice = availableVoices.find(v => /hi|hin|hi-IN/i.test(v.lang)) || null;
}
populateVoices();
if(supportsSpeechSynthesis) window.speechSynthesis.onvoiceschanged = populateVoices;

function speakAsync(text, timeoutMs = 4500) {
  return new Promise((resolve) => {
    if(!supportsSpeechSynthesis || !soundOn) { resolve({ok:false, reason: soundOn ? 'no-tts' : 'muted'}); return; }
    try {
      if(finishSpeech) finishSpeech();
      try { window.speechSynthesis.cancel(); } catch(e){}
      const u = new SpeechSynthesisUtterance(text);
      u.lang = preferHindiVoice ? preferHindiVoice.lang : 'hi-IN';
      if(preferHindiVoice) u.voice = preferHindiVoice;
      u.rate = 0.95; u.pitch = 1.05;
      let finished = false;
      let tout;
      const onEnd = () => { if(finished) return; finished = true; cleanup(); resolve({ok:true}); };
      const onErr = () => { if(finished) return; finished = true; cleanup(); resolve({ok:false,reason:'error'}); };
      function cleanup(){ u.onend = u.onerror = null; clearTimeout(tout); if(finishSpeech === onEnd) finishSpeech = null; }
      u.onend = onEnd; u.onerror = onErr;
      finishSpeech = onEnd;
      window.speechSynthesis.speak(u);
      tout = setTimeout(()=>{ if(finished) return; finished = true; try{ window.speechSynthesis.cancel(); }catch(e){}; cleanup(); resolve({ok:false, reason:'timeout'}); }, timeoutMs);
    } catch(e){ resolve({ok:false, reason:'exception'}); }
  });
}

/* ============
   Sound ding
   ============ */
let soundOn = true;
try { soundOn = localStorage.getItem('hindi_flash_sound') !== 'off'; } catch(e){}
const activeAudioContexts = new Set();
function setSoundEnabled(enabled) {
  soundOn = enabled;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  const label = soundOn ? 'Mute all audio' : 'Unmute audio';
  soundBtn.title = label;
  soundBtn.setAttribute('aria-label', label);
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  hintTTS.disabled = !soundOn || !supportsSpeechSynthesis;
  hintTTS.title = !supportsSpeechSynthesis ? 'Pronunciation unavailable' : soundOn ? 'Pronounce word' : 'Unmute audio to hear words';
  if(!soundOn) {
    if(finishSpeech) finishSpeech();
    if(supportsSpeechSynthesis) window.speechSynthesis.cancel();
    for(const ctx of activeAudioContexts) {
      try { ctx.close().catch(()=>{}); } catch(e){}
    }
    activeAudioContexts.clear();
  }
  try { localStorage.setItem('hindi_flash_sound', soundOn ? 'on' : 'off'); } catch(e){}
}
soundBtn.addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(!soundOn); });
setSoundEnabled(soundOn);
function playDing() {
  if(!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    activeAudioContexts.add(ctx);
    const now = ctx.currentTime;
    const o1 = ctx.createOscillator(), g1 = ctx.createGain();
    o1.type='sine'; o1.frequency.value = 880; g1.gain.value = 0.0001;
    o1.connect(g1); g1.connect(ctx.destination);
    g1.gain.setValueAtTime(0.0001, now); g1.gain.exponentialRampToValueAtTime(0.06, now+0.005); g1.gain.exponentialRampToValueAtTime(0.0001, now+0.24);
    o1.start(now); o1.stop(now+0.25);
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type='square'; o2.frequency.value = 1760; g2.gain.value = 0.0001;
    o2.connect(g2); g2.connect(ctx.destination);
    g2.gain.setValueAtTime(0.0001, now); g2.gain.exponentialRampToValueAtTime(0.03, now+0.002); g2.gain.exponentialRampToValueAtTime(0.0001, now+0.12);
    o2.start(now); o2.stop(now+0.13);
    setTimeout(()=>{ activeAudioContexts.delete(ctx); try{ ctx.close().catch(()=>{}); }catch(e){} }, 700);
  } catch(e){}
}

/* ============
   Level selection UI (static keys derived from data)

function showLevelOverlay() {

/* ============
   App navigation: back/forward stacks (max 5)
   ============ */
const HISTORY_MAX = 5;
let currentLevelKey = null;
let levelWords = []; // words of selected level
let backStack = [];   // stack of indices previously seen (older at 0, newest at end). top = end()
let forwardStack = []; // stack of indices that were reached by going back (top = end)
let currentIndex = null; // index in levelWords that is currently visible
let isSpeakingOrAdvancing = false;
let navigationVersion = 0;
let remainingWords = [];
let seenWords = new Set();

/* Utility: show word by index with animation & optionally update progress */
function showWordIndex(idx, { animate = true } = {}) {
  const version = navigationVersion;
  const text = (typeof idx === 'number' && idx >= 0 && idx < levelWords.length) ? levelWords[idx] : '';
  if(!text) return;
  if(animate) {
    wordElWrapper.classList.add('out');
    setTimeout(()=>{
      if(version !== navigationVersion) return;
      wordText.textContent = text;
      wordElWrapper.classList.remove('out');
      wordElWrapper.classList.add('in');
      void wordElWrapper.offsetWidth;
      setTimeout(()=> wordElWrapper.classList.add('show'), 10);
      setTimeout(()=> wordElWrapper.classList.remove('in','show'), 360);
    }, 120);
  } else {
    wordText.textContent = text;
  }
  seenWords.add(idx);
  progress.textContent = `${seenWords.size} / ${levelWords.length} explored`;
}

/* Draw without repeats until every word has been shown. */
function randomIndexExcluding(excludeIdx) {
  if(levelWords.length === 0) return null;
  if(remainingWords.length === 0) {
    remainingWords = levelWords.map((_, index) => index);
    for(let i = remainingWords.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [remainingWords[i], remainingWords[j]] = [remainingWords[j], remainingWords[i]];
    }
    const last = remainingWords.length - 1;
    if(last > 0 && remainingWords[last] === excludeIdx) {
      [remainingWords[0], remainingWords[last]] = [remainingWords[last], remainingWords[0]];
    }
  }
  return remainingWords.pop();
}

/* Advance flow when the user requests "next" (click / space / right):
   1) If there's no current card -> generate a new random (no TTS).
   2) Otherwise: forced speak current word, then:
      - If forwardStack not empty -> pop from forwardStack and show it (preserve order). This is NOT counted as new read.
      - Else -> generate a new random index, show it, increment read-today.
   Maintain stacks: when moving forward to a new random, push previous current to backStack (trim to 5) and clear forwardStack.
   When moving forward using forwardStack, push previous current to backStack (trim to 5).
*/
async function userRequestedNext() {
  if(isSpeakingOrAdvancing || overlay.style.display !== 'none') return;
  const version = navigationVersion;
  // if no current card, just advance to new random (no TTS)
  if(currentIndex === null) {
    advanceToNewRandom();
    return;
  }

  isSpeakingOrAdvancing = true;
  try {
    // forced speak current
    await speakAsync(levelWords[currentIndex], 4500).catch(()=>{});
  } finally {
    if(version !== navigationVersion) return;
    // proceed to next (either forwardStack or new random)
    if(forwardStack.length > 0) {
      // go forward from forwardStack
      const nextIdx = forwardStack.pop();
      // push current to backStack
      if(currentIndex !== null) {
        backStack.push(currentIndex);
        if(backStack.length > HISTORY_MAX) backStack.shift();
      }
      currentIndex = nextIdx;
      showWordIndex(currentIndex, { animate: true });
      // pronounce the new card after showing
      try { await speakAsync(levelWords[currentIndex], 3500); } catch(e){}
      if(version !== navigationVersion) return;
      playDing();
      // note: not incrementing read-today when moving through forward stack
    } else {
      // no forward history — generate a new random card
      advanceToNewRandom();
    }
    isSpeakingOrAdvancing = false;
  }
}

/* advanceToNewRandom: generate a new random index, push previous current to backStack, clear forwardStack,
   update read-today (increment), show & play ding & (optionally) auto-pronounce
*/
function advanceToNewRandom() {
  if(levelWords.length === 0 || overlay.style.display !== 'none') return;
  const prev = currentIndex;
  const next = randomIndexExcluding(prev);
  // push prev into backStack (if exists)
  if(prev !== null) {
    backStack.push(prev);
    if(backStack.length > HISTORY_MAX) backStack.shift();
  }
  // clear forwardStack (new branch)
  forwardStack = [];
  currentIndex = next;
  showWordIndex(currentIndex, { animate: true });
  // increment read-today
  const nowCount = readTodayGet() + 1;
  readTodaySet(nowCount);
  readTodayCountEl.textContent = nowCount;
  // play ding and optionally pronounce new card automatically? we will NOT auto-pronounce to avoid overlap.
  setTimeout(()=> playDing(), 220);
}

/* User requested "back" (Left Arrow) behavior:
   - If backStack empty -> nothing.
   - Else: move current to forwardStack (if exists), pop previous from backStack to current, show it, pronounce it.
   - Do not increment read-today when going back.
*/
async function userRequestedBack() {
  if(isSpeakingOrAdvancing || overlay.style.display !== 'none') return;
  const version = navigationVersion;
  if(backStack.length === 0) return; // nothing to go back to
  isSpeakingOrAdvancing = true;
  try {
    const prevIdx = backStack.pop(); // the one to show
    // push current into forwardStack (if exists)
    if(currentIndex !== null) {
      forwardStack.push(currentIndex);
      if(forwardStack.length > HISTORY_MAX) forwardStack.shift();
    }
    currentIndex = prevIdx;
    showWordIndex(currentIndex, { animate: true });
    // pronounce the shown card
    try { await speakAsync(levelWords[currentIndex], 4500); } catch(e){}
    if(version !== navigationVersion) return;
    playDing();
  } finally {
    if(version === navigationVersion) isSpeakingOrAdvancing = false;
  }
}

/* hint button: pronounce current card on demand (no navigation) */
if(!supportsSpeechSynthesis) {
  hintTTS.title = 'Pronunciation unavailable';
  hintTTS.disabled = true;
  hintTTS.style.opacity = 0.6;
  hintTTS.textContent = '❌';
} else {
  hintTTS.addEventListener('click', (e) => {
    e.stopPropagation();
    if(currentIndex === null) return;
    // speak current
    speakAsync(levelWords[currentIndex], 3500).catch(()=>{});
  });
}

/* Shuffle / restart: clear stacks and create fresh random state for level */
shuffleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if(isSpeakingOrAdvancing) return;
  // clear stacks and current, then advance to new random (no forced TTS)
  backStack = [];
  forwardStack = [];
  currentIndex = null;
  remainingWords = []; seenWords.clear();
  // show blank and then new
  wordText.textContent = '';
  setTimeout(()=> advanceToNewRandom(), 120);
});

/* Keyboard / click wiring */
const levelsBtn = document.getElementById('levelsBtn');
levelsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  showLevelOverlay();
});
levelsBtn.addEventListener('keydown', (e) => e.stopPropagation());
card.addEventListener('click', (e) => {
  if(e.target.closest('button, a, .controls')) return;
  // Keyboard/assistive clicks have no pointer position; keep their Next action.
  if(e.detail === 0) return userRequestedNext();
  const bounds = card.getBoundingClientRect();
  return e.clientX < bounds.left + bounds.width * 0.25
    ? userRequestedBack()
    : userRequestedNext();
});
window.addEventListener('keydown', (e) => {
  if(!activityOverlay.hidden) {
    if(e.key === 'Escape') { e.preventDefault(); hideActivity(); }
    if(e.key === 'Tab') {
      const first = closeActivityBtn;
      const last = activityGrid.lastElementChild || first;
      if(e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if(overlay.style.display !== 'none') {
    if(e.key === 'Escape' && currentLevelKey) {
      hideLevelOverlay();
      levelsBtn.focus();
    }
    if(e.key === 'Tab') {
      const buttons = [...overlay.querySelectorAll('button:not([hidden])')];
      const first = buttons[0], last = buttons[buttons.length - 1];
      if(e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if(e.target.closest('button, a')) return;
  if(e.code === 'Space' || e.code === 'ArrowRight') {
    e.preventDefault();
    userRequestedNext();
  } else if(e.code === 'ArrowLeft') {
    e.preventDefault();
    userRequestedBack();
  } else if(e.code === 'KeyR') {
    if(isSpeakingOrAdvancing) return;
    // restart
    backStack = []; forwardStack = []; currentIndex = null; remainingWords = []; seenWords.clear(); advanceToNewRandom();
  }
});

/* make card focusable for Enter */
card.addEventListener('keydown', (e) => {
  if(e.target.closest('button')) return;
  if(e.key === 'Enter') {
    e.preventDefault();
    userRequestedNext();
  }
});
card.setAttribute('tabindex','0');

/* Read-today init */
readTodayCountEl.textContent = readTodayGet();

/* Date rollover safety — refresh displayed readToday if day changes */
let lastTodayKey = todayKey();
setInterval(()=> {
  const k = todayKey();
  if(k !== lastTodayKey) {
    readTodayCountEl.textContent = readTodayGet();
    lastTodayKey = k;
  }
}, 60*1000);

/* Level selection - persist chosen level to localStorage */
function selectLevel(key) {
  if(!data[key]) return;
  navigationVersion++;
  isSpeakingOrAdvancing = false;
  localStorage.setItem(levelKey(), key);
  currentLevelKey = key;
  levelWords = Array.isArray(data[key].words) ? data[key].words.slice() : [];
  hideLevelOverlay();
  // initialize stacks and show first card
  backStack = []; forwardStack = []; currentIndex = null;
  remainingWords = []; seenWords.clear();
  readTodayCountEl.textContent = readTodayGet();
  // show stage
  mainStage.style.display = 'flex';
  overlay.style.display = 'none';
  levelsBtn.textContent = `Levels · ${Object.keys(data).indexOf(key) + 1}`;
  card.focus();
  advanceToNewRandom();
}

/* Build level selection buttons from static data keys */
function initLevelGrid() {
  levelGrid.innerHTML = '';
  Object.keys(data).forEach((k, index) => {
    const item = data[k];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'level-btn';
    if(currentLevelKey === k) btn.setAttribute('aria-current', 'true');
    btn.setAttribute('aria-label', `${item.label}, ${item.subtitle}, ${item.words.length} words`);
    btn.innerHTML = `
      <span class="level-icon" aria-hidden="true">${item.icon}</span>
      <span class="level-text">
      <span class="level-name">${item.label}</span>
      <span class="level-subtitle" lang="hi">${item.subtitle}</span>
      </span>`;
    btn.addEventListener('click', ()=> selectLevel(k));
    levelGrid.appendChild(btn);
  });
}

/* On load: show overlay unless a saved level exists */
window.addEventListener('load', () => {
  initLevelGrid();
  const saved = localStorage.getItem(levelKey());
  if(saved && data[saved]) {
    // auto-select and start
    selectLevel(saved);
  } else {
    mainStage.style.display = 'none';
    showLevelOverlay();
  }
});
</script>
</body>
</html>
